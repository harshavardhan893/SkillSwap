
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkillSwap - Student Directory</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .logout-button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 15px;
        }
    </style>
</head>

<body>

    <button class="logout-button" onclick="logout()">Logout</button>

    <header>
        <h1>SkillSwap</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Join Now</a>
        </nav>
    </header>

    <main>
        <h1>Student Directory</h1>

        <p>Find students and discover skills to exchange.</p>

        <input
            type="text"
            id="searchInput"
            placeholder="Search by name, college or skill..."
        >

        <div id="studentList">
            <p>Loading students...</p>
        </div>

        <p id="message"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="students.js"></script>

</body>
</html>
