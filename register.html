
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap - Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Join SkillSwap</h1>
    <p>Create your student account and exchange skills!</p>

    <form id="registerForm">

        <label>Full Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" minlength="8" required>

        <label>College</label>
        <input type="text" id="college" required>

        <label>Skill You Can Teach</label>
        <input type="text" id="teach" required>

        <label>Skill You Want to Learn</label>
        <input type="text" id="learn" required>

        <button type="submit">Create Account</button>

        <p id="message"></p>

    </form>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>

</body>
</html>
